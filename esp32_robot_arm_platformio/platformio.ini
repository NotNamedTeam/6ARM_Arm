[platformio]
; The current Python calibration does not require any upload.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<main.cpp>
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  madhephaestus/ESP32Servo@1.2.1

[env:esp32-calibration]
extends = env:esp32dev
build_src_filter = -<*> +<calibration.cpp>

[env:esp32-manual-calibration]
extends = env:esp32dev
build_src_filter = -<*> +<manual_calibration.cpp>

[env:esp32-center-d17]
extends = env:esp32dev
build_src_filter = -<*> +<center_d17.cpp>

; If your board is ESP32-S3/C3 rather than a classic ESP32 DevKit/WROOM,
; change `board` and verify the pins in include/config.h before connecting servos.
